<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="../assets/report.css" />
    <script src="../assets/charts.js"></script>
  </head>
  <body>
    <header id="nav" class="site-header"></header>

    <main class="page">
      <h1>{{title}}</h1>

      <section class="empty-state">
        <h2>Nothing on this page yet</h2>
        <p>
          Ask the assistant for the charts you want here, for example “monthly
          revenue by region”, or edit this page’s HTML.
        </p>
      </section>

      <!--
        Charts go in elements like these, laid out with the grid classes in
        assets/report.css. Each reads a dataset, data/<name>.json:

        <div class="grid">
          <div id="revenue"></div>
        </div>
        <script>
          pawpaw.lineChart('#revenue', 'revenue_by_month', { title: 'Revenue by month' });
        </script>
      -->
    </main>

    <script>
      pawpaw.nav('#nav');
    </script>
  </body>
</html>
